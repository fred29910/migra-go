name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-windows:
    name: Build (Linux + Windows)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/goreleaser/goreleaser-cross:v1.26
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 确保完整 git 历史，goreleaser 需要它来解析 tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Go 和交叉编译工具链已内置在 goreleaser-cross 容器中
      # 不再需要手动安装 gcc-aarch64-linux-gnu / gcc-mingw-w64

      # 修复容器内 git 安全目录检查（CVE-2022-24765）：
      # 容器内工作目录由 runner 用户挂载，导致 git 报 dubious ownership
      - name: Fix git safe.directory (container ownership mismatch)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run GoReleaser (skip publish)
        run: goreleaser release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-windows
          path: dist/*
          retention-days: 1

  build-darwin:
    name: Build (Darwin)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          install-only: true

      - name: Run GoReleaser (Darwin, skip publish)
        run: goreleaser release --clean --skip=publish -f .goreleaser-darwin.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: dist/*
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: [build-linux-windows, build-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux/Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-linux-windows
          path: dist-linux-windows

      - name: Download Darwin artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-darwin
          path: dist-darwin

      - name: Merge checksums
        run: |
          echo "# migra ${{ github.ref_name }} checksums" > migra_checksums.txt
          echo "" >> migra_checksums.txt
          cat dist-linux-windows/checksums-linux-windows.txt >> migra_checksums.txt
          cat dist-darwin/checksums-darwin.txt >> migra_checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-linux-windows/*.tar.gz
            dist-linux-windows/*.zip
            dist-linux-windows/*.sbom.spdx.json
            dist-darwin/*.tar.gz
            migra_checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
