# .goreleaser-linux.yaml
# GoReleaser 配置 — Linux 构建（linux/amd64, linux/arm64）
# 由 release.yml -> build-linux job 使用

version: 2

project_name: migra

env:
  - CGO_ENABLED=1

builds:
  - binary: migra
    main: ./cmd/migra
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w
      - -X github.com/fred29910/migra-go/internal/version.Version={{ .Tag }}
      - -X github.com/fred29910/migra-go/internal/version.BuildTime={{ .Date }}
      - -X github.com/fred29910/migra-go/internal/version.GitCommit={{ .ShortCommit }}
    overrides:
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - CGO_ENABLED=1

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}-
      {{- .Os }}-
      {{- .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums-linux.txt"
  algorithm: sha256

sboms:
  - id: spdx
    artifacts: binary
    documents:
      - "{{ .ProjectName }}.sbom.spdx.json"
    args: ["$artifact", "--output", "spdx-json=$document"]

dist: dist
