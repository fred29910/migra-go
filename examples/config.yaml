# migra 配置文件示例
# 复制为 ~/.migra.yaml 或 ./migra.yaml

# 数据库连接
database:
  # 默认数据库连接字符串
  url: "postgres://localhost:5432/mydb?sslmode=disable"
  
  # 连接池配置
  pool:
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime: "1h"

# 比较选项
diff:
  # 指定要比较的 schema（默认：public）
  schemas:
    - public
    - auth
    - api
  
  # 是否允许破坏性 DROP 操作
  unsafe_drop: false
  
  # 遇到不支持的语句时是否失败
  strict: false
  
  # 输出格式：sql 或 json
  format: sql

# 输出选项
output:
  # 输出文件（空则输出到 stdout）
  file: ""
  
  # 是否显示详细输出
  verbose: false

# 日志配置
logging:
  level: "info"  # debug, info, warn, error
  format: "text"  # text, json
